name: CI and Pages
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          check-latest: true
          cache: npm
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify binary storage and materialized LFS inputs
        run: |
          git lfs fsck --objects
          python -m scripts.check_lfs --history
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Lint and type-check renderer
        run: npm run lint
      - name: Test renderer foundation
        run: npm run test:rendering
      - name: Build synthetic renderer fixture preview (not deployed)
        run: npm run build
        env:
          SITE_OUTPUT_DIR: ${{ runner.temp }}/renderer-fixture-dist
          ASTRO_TELEMETRY_DISABLED: '1'
          BUILD_TIME: '2026-01-01T00:00:00Z'
      - name: Verify materialized renderer artifact
        run: python -m scripts.check_lfs --artifact "$RUNNER_TEMP/renderer-fixture-dist"
      # Keep the safe placeholder as the deployed artifact until full archive
      # and visual/behavior fidelity acceptance. Never publish fixture content.
      - name: Build preview
        run: python scripts/build.py
      - name: Verify materialized Pages artifact and output limit
        run: python -m scripts.check_lfs --artifact dist
      # Package directly to keep upload-artifact on its latest pinned release;
      # upload-pages-artifact currently pins an older upload-artifact patch.
      - name: Package Pages artifact
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: >-
          tar --dereference --hard-dereference --directory dist
          --exclude=.git --exclude=.github
          -cvf "$RUNNER_TEMP/artifact.tar" .
      - name: Upload Pages artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: check-build
    runs-on: ubuntu-24.04
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
