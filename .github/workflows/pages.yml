name: CI and Pages
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build preview
        run: python scripts/build.py
      # Package directly to keep upload-artifact on its latest pinned release;
      # upload-pages-artifact currently pins an older upload-artifact patch.
      - name: Package Pages artifact
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: >-
          tar --dereference --hard-dereference --directory dist
          --exclude=.git --exclude=.github
          -cvf "$RUNNER_TEMP/artifact.tar" .
      - name: Upload Pages artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: check-build
    runs-on: ubuntu-24.04
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
