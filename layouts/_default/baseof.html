<!doctype html>
<html lang="{{ .Site.Language.Lang }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="site-title" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
        <nav aria-label="Main navigation"><ul>{{ range site.Menus.main }}<li><a href="{{ .URL }}">{{ .Name }}</a></li>{{ end }}</ul></nav>
      </div>
    </header>
    <main id="main" class="container">{{ block "main" . }}{{ end }}</main>
    <footer class="site-footer"><div class="container"><p>{{ site.Title }}</p></div></footer>
  </body>
</html>
