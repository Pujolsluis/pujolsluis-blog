  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {{ if site.Params.preview }}<meta name="robots" content="noindex, nofollow">{{ else }}<meta name="robots" content="index, follow">{{ end }}
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
  {{ with .Description }}<meta name="description" content="{{ . | plainify | htmlEscape }}">{{ else }}{{ with site.Params.description }}<meta name="description" content="{{ . | htmlEscape }}">{{ end }}{{ end }}
  <link rel="canonical" href="{{ .Permalink }}">
  <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
  <meta property="og:title" content="{{ .Title | htmlEscape }}">
  <meta property="og:url" content="{{ .Permalink }}">
  {{ with .Description }}<meta property="og:description" content="{{ . | plainify | htmlEscape }}">{{ end }}
  <link rel="stylesheet" href="{{ "theme/css/main.css" | relURL }}">
  {{ if not site.Params.preview }}<link rel="sitemap" type="application/xml" href="{{ "sitemap.xml" | absURL }}">{{ end }}
