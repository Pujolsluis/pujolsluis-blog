{{ define "main" }}
  <section class="search-page" data-search-page data-index-url="{{ printf "%ssearch-index.json" site.Home.RelPermalink }}">
    <header class="page-header">
      <p class="eyebrow">Search</p>
      <h1>Search posts</h1>
      <p>Search post titles and article text. Select a result to open the post.</p>
    </header>
    <form class="search-page-form" role="search" method="get" action="{{ .RelPermalink }}">
      <label for="search-results-query">Search posts</label>
      <div class="search-page-controls">
        <input id="search-results-query" type="search" name="q" data-search-query autocomplete="off">
        <button type="submit">Search</button>
      </div>
    </form>
    <p id="search-status" class="search-status" data-search-status aria-live="polite">Enter a search term to find posts.</p>
    <ul class="search-results post-list" data-search-results aria-label="Search results" aria-busy="false"></ul>
    <nav class="search-pagination" data-search-pagination aria-label="Search result pages" hidden>
      <ul class="pagination pagination-default" data-search-page-links aria-label="Search result page numbers"></ul>
    </nav>
  </section>
{{ end }}
